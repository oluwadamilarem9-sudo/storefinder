# Path A: Streamlit app on Render + Render Postgres (not Supabase / not Streamlit Cloud).
# Deploy: Render Dashboard → New → Blueprint → connect this repo → Apply.
databases:
  - name: storefinder-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Private network only — the web service reaches Postgres internally.
    ipAllowList: []

services:
  - type: web
    name: storefinder
    runtime: python
    plan: free
    buildCommand: pip install -r shopify-lead-finder/requirements.txt
    startCommand: streamlit run shopify-lead-finder/app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: storefinder-db
          property: connectionString
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
